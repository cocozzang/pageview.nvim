# Releases are made by release-please: it keeps a pull request with the next
# version and CHANGELOG.md up to date, and merging that pull request tags the
# release. The rock goes to luarocks.org in the same workflow, because a tag
# created with GITHUB_TOKEN starts no other workflow.
name: release

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  luarocks:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      # Without a Lua found through pkg-config, lux downloads and builds Lua
      # from lua.org, which often refuses connections from these runners.
      - name: Lua for lux
        run: sudo apt-get update -q && sudo apt-get install -y -q liblua5.1-0-dev
      - uses: nvim-neorocks/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUX_API_KEY }}
        with:
          version: ${{ needs.release-please.outputs.tag_name }}
          # assets/ holds page.html and the bundled libraries
          copy_directories: |
            {{ neovim.plugin.dirs }}
            assets

  # In a pull request: build the rock and install it locally, without uploading.
  luarocks-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lua for lux
        run: sudo apt-get update -q && sudo apt-get install -y -q liblua5.1-0-dev
      # The release job must not need lua.org (see above): fail here if it would.
      - name: Block lua.org
        run: echo "0.0.0.0 www.lua.org lua.org" | sudo tee -a /etc/hosts
      - uses: nvim-neorocks/luarocks-tag-release@v9
        with:
          copy_directories: |
            {{ neovim.plugin.dirs }}
            assets
